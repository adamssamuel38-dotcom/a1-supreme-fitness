<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>A1SF Sandbox Test</title><style>body{font:18px system-ui;background:#f5f7f4;color:#19231e;margin:0;padding:30px}main{max-width:600px;margin:40px auto}button,a{font:inherit}button{padding:16px;border:0;border-radius:14px;margin:8px 0;cursor:pointer}button:first-of-type{background:#ffc439}#status{padding:20px;background:white;border:1px solid #ccc;border-radius:12px;overflow-wrap:anywhere}button:disabled{opacity:.5}a{color:#25543d}</style></head><body><main><p>A1 SUPREME FITNESS · OWNER TEST</p><h1>PayPal sandbox checkout</h1><p>Simulated $14.99/month. Use your PayPal sandbox <strong>Personal</strong> buyer account. This test cannot activate a live membership.</p><p><a href="/login?next=/sandbox.html">Sign in to your A1SF account</a></p><button id="start">Start sandbox checkout</button><br><button id="check">Verify simulated payment</button><p id="status" role="status">Checking test setup…</p><p id="result"></p><a href="/membership">Return to live membership</a></main><script>
const statusEl=document.getElementById('status'),result=document.getElementById('result'),start=document.getElementById('start'),check=document.getElementById('check');
async function run(method){start.disabled=check.disabled=true;statusEl.textContent='Checking sandbox…';try{const r=await fetch('/api/sandbox/membership',{method,headers:{'Content-Type':'application/json'},cache:'no-store',signal:AbortSignal.timeout(90000)});const d=await r.json();if(!r.ok)throw Error(d.error||'Sandbox unavailable.');if(d.sandbox!==true)throw Error('Unexpected payment environment.');if(d.approvalUrl){const u=new URL(d.approvalUrl);if(u.protocol!=='https:'||u.hostname!=='www.sandbox.paypal.com')throw Error('Blocked a non-sandbox checkout link.');location.assign(u.href);return;}statusEl.textContent=d.paid?'PASS: Completed sandbox payment verified. Simulated membership is active.':d.status||'Sandbox ready.';result.textContent=d.paid?'Paid through '+d.paidUntil+'. Live membership remains unchanged.':'';}catch(e){statusEl.textContent=e.name==='TimeoutError'?'The request timed out. Verify simulated payment before retrying checkout.':e.message;}finally{start.disabled=check.disabled=false;}}
start.onclick=()=>run('POST');check.onclick=()=>run('GET');run('GET');
</script></body></html>
